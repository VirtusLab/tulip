name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      # Catches runtime imports of packages missing from `dependencies`.
      - name: Run the packed package with production dependencies only
        run: |
          pnpm build:dist
          mkdir -p "$RUNNER_TEMP/pkg"
          pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP/pkg"
          npm init -y
          npm install --omit=dev --no-audit --no-fund ./*.tgz
          npx --no-install tulip --help

  auto-merge-dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    needs: [build-test-lint]
    permissions:
      contents: write
      pull-requests: write
    uses: softwaremill/github-actions-workflows/.github/workflows/auto-merge.yml@main
